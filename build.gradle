plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    versions = [
        springBootVersion: '3.5.5',
        springCloudVersion: '2025.0.0',
        openTelemetryVersion: '2.29.0',
        openTelemetrySdkVersion: '1.63.0',
        testcontainersVersion: '2.0.2',
        swaggerAnnotationsVersion: '2.2.38',
        springdocOpenapiVersion: '2.8.13',
        lombokVersion: '1.18.38',
        lombokMapstructBindingVersion: '0.2.0',
        mapstructVersion: '1.6.3',
        postgresqlVersion: '42.7.7',
        liquibaseVersion: '5.0.1',
        wiremockVersion: '3.13.1',
        datafakerVersion: '2.5.3'
    ]
}

group = 'com.twitter'
version = '0.0.1-SNAPSHOT'
description = 'Twitter Microservices Monorepo'

allprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    java {
        sourceCompatibility = '24'
        targetCompatibility = '24'
        toolchain {
            languageVersion = JavaLanguageVersion.of(24)
        }
    }

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
        maven { url 'https://repo.spring.io/snapshot' }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

subprojects {
    apply plugin: 'io.spring.dependency-management'

    ext['opentelemetry.version'] = rootProject.ext.versions.openTelemetrySdkVersion

    configurations.configureEach { resolutionStrategy.cacheChangingModulesFor(0, "seconds") }

    dependencyManagement {
        imports {
            mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${rootProject.ext.versions.openTelemetryVersion}"
            mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.versions.springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.versions.springCloudVersion}"
            mavenBom "org.testcontainers:testcontainers-bom:${rootProject.ext.versions.testcontainersVersion}"
        }
        
        dependencies {
            // Swagger/OpenAPI dependencies
            dependency "io.swagger.core.v3:swagger-annotations:${rootProject.ext.versions.swaggerAnnotationsVersion}"
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.versions.springdocOpenapiVersion}"
            
            // Lombok dependencies
            dependency "org.projectlombok:lombok:${rootProject.ext.versions.lombokVersion}"
            dependency "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.versions.lombokMapstructBindingVersion}"
            
            // MapStruct dependencies
            dependency "org.mapstruct:mapstruct:${rootProject.ext.versions.mapstructVersion}"
            dependency "org.mapstruct:mapstruct-processor:${rootProject.ext.versions.mapstructVersion}"
            
            // Database dependencies
            dependency "org.postgresql:postgresql:${rootProject.ext.versions.postgresqlVersion}"

            dependency "org.liquibase:liquibase-core:${rootProject.ext.versions.liquibaseVersion}"

            dependency "org.wiremock:wiremock-standalone:${rootProject.ext.versions.wiremockVersion}"
            
            // Datafaker for generating fake data
            dependency "net.datafaker:datafaker:${rootProject.ext.versions.datafakerVersion}"
        }
    }
}


dependencies {
    // Корневой проект не имеет собственных зависимостей
}